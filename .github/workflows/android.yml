name: Build Android App
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "آدرس سرور شما (مثال https://sorianoir.ir)"
        required: true
        default: "https://sorianoir.ir"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project and bundle the UI inside the app
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          set -e
          SERVER_URL="${SERVER_URL%/}"
          mkdir app && cd app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 socket.io-client@4 @fontsource/vazirmatn@5
          mkdir -p www/fonts
          curl -fsSL "$SERVER_URL/index.html" -o www/index.html
          cp node_modules/socket.io-client/dist/socket.io.min.js www/socket.io.min.js
          echo "window.APP_API='$SERVER_URL';" > www/config.js
          : > www/fonts.css
          for w in 400 600 800; do
            for sub in arabic latin; do
              f="node_modules/@fontsource/vazirmatn/files/vazirmatn-$sub-$w-normal.woff2"
              if [ -f "$f" ]; then
                cp "$f" www/fonts/
                if [ "$sub" = "arabic" ]; then R="U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF"; else R="U+0000-00FF"; fi
                echo "@font-face{font-family:Vazirmatn;font-weight:$w;src:url(fonts/vazirmatn-$sub-$w-normal.woff2) format('woff2');unicode-range:$R}" >> www/fonts.css
              fi
            done
          done
          sed -i 's#/socket.io/socket.io.js#socket.io.min.js#' www/index.html
          sed -i 's#<link href="https://fonts.googleapis.com[^>]*>#<link rel="stylesheet" href="fonts.css">#' www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.soriany.app","appName":"Soriany","webDir":"www","server":{"androidScheme":"https"}}
          JSON
          npx cap add android
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf8').read()
          s=s.replace('<application','<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application',1)
          open(p,'w',encoding='utf8').write(s)
          q='android/app/src/main/res/values/strings.xml'
          t=open(q,encoding='utf8').read().replace('>Soriany<','>سوریانوی<')
          open(q,'w',encoding='utf8').write(t)
          PY
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/soriany.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: soriany-apk
          path: soriany.apk
      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Soriany v${{ github.run_number }}
          files: soriany.apk
