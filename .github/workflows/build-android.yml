name: Build Android App
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web assets (all UI bundled inside the app)
        working-directory: app
        run: |
          npm install
          rm -rf www && mkdir -p www/fonts
          cp ../public/index.html www/index.html
          cp node_modules/socket.io-client/dist/socket.io.min.js www/socket.io.min.js
          echo "window.APP_API='${{ vars.SERVER_URL }}';" > www/config.js
          : > www/fonts.css
          for w in 400 600 800; do for sub in arabic latin; do
            f=node_modules/@fontsource/vazirmatn/files/vazirmatn-$sub-$w-normal.woff2
            if [ -f "$f" ]; then cp "$f" www/fonts/
              if [ $sub = arabic ]; then R='U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF'; else R='U+0000-00FF'; fi
              echo "@font-face{font-family:Vazirmatn;font-weight:$w;src:url(fonts/vazirmatn-$sub-$w-normal.woff2) format('woff2');unicode-range:$R}" >> www/fonts.css
            fi
          done; done
          sed -i 's#/socket.io/socket.io.js#socket.io.min.js#' www/index.html
          sed -i 's#<link href="https://fonts.googleapis.com[^>]*>#<link rel="stylesheet" href="fonts.css">#' www/index.html
      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: soriany-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Soriany v${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/*.apk
